<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Image Explorer</title>
  </head>
  <body>
    <canvas id="canvas"></canvas>

    <div id="empty" class="empty">
      <p class="kicker">Image explorer</p>
      <h1>Add images to begin</h1>
      <p>Drop files here, paste, or choose them. Zoom to cycle — a photo that leaves the back reappears at the front.</p>
      <label class="file">
        <input id="file" type="file" accept="image/*" multiple />
        <span>Choose images</span>
      </label>
    </div>

    <div class="chrome">
      <label class="add-btn" id="addBtn" hidden>
        <span>Add images</span>
      </label>
      <button type="button" id="settingsBtn" class="icon-btn" aria-expanded="false" aria-controls="tweaks">
        Settings
      </button>
    </div>

    <aside class="tweaks" id="tweaks" hidden>
      <header class="tweaks-head">
        <h2>Settings</h2>
        <button type="button" id="settingsClose" class="icon-btn">Close</button>
      </header>

      <section>
        <h2>Images</h2>
        <p class="hint" id="imageCount">No images</p>
        <div class="row">
          <button type="button" id="addMore">Add</button>
          <button type="button" id="clearImages">Clear</button>
        </div>
        <label class="field">
          <span>Area <em id="areaVal">0.07</em></span>
          <input id="imageArea" type="range" min="0.02" max="0.36" step="0.01" />
        </label>
      </section>

      <section>
        <h2>Palette</h2>
        <div id="palette" class="palette"></div>
        <button type="button" id="addColor">Add color</button>
      </section>

      <section>
        <h2>Dither</h2>
        <label class="field">
          <span>Method</span>
          <select id="mode"></select>
        </label>
        <label class="field">
          <span>Coarseness <em id="coarsenessVal">1×</em></span>
          <input id="coarseness" type="range" min="0" max="4" step="1" />
        </label>
        <button type="button" id="copySettings">Copy settings JSON</button>
      </section>

      <section>
        <h2>Vignette</h2>
        <label class="field">
          <span>Radius <em id="vigRadiusVal">0.42</em></span>
          <input id="vignetteRadius" type="range" min="0" max="1.2" step="0.02" />
        </label>
        <label class="field">
          <span>Softness <em id="vigSoftVal">0.62</em></span>
          <input id="vignetteSoftness" type="range" min="0.02" max="1.4" step="0.02" />
        </label>
        <label class="field">
          <span>Strength <em id="vigStrVal">1.00</em></span>
          <input id="vignetteStrength" type="range" min="0" max="1" step="0.02" />
        </label>
      </section>

      <section>
        <h2>View</h2>
        <label class="field">
          <span>Projection</span>
          <select id="projection"></select>
        </label>
        <label class="toggle">
          <input id="spiral" type="checkbox" />
          <span>Show spiral</span>
        </label>
      </section>

      <section id="motion">
        <h2>Motion</h2>
      </section>
    </aside>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
